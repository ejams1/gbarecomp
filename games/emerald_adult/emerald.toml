# Hand-maintained shared recompiler/runtime config for the Modern Emerald ROM.
# Generated symbol metadata is passed as a later --config overlay and never
# overwrites this file.

[program]
name = "Pokemon Modern Emerald (USA)"
id = "pokemon_modern_emerald"
load_address = 0x08000000
size = 0x02000000
entry_pc = 0x08000000
static_resume_all = true

[identity]
sha1 = "c6608fa784a8755c35dceee01f288780460ebeb5"

# The vector at 0x08000000 is the ARM reset entry. IntrMain is an assembly IRQ
# dispatch root with ELF STT_NOTYPE, so it is explicitly seeded here.
[[extra_func]]
addr = 0x08000250
mode = "arm"
name = "IntrMain"
note = "ELF map/objdump verified IRQ dispatch root; ELF type is NOTYPE"

# The ROM's options_plus_menu DrawTopBarText switch uses an absolute Thumb
# jump table at 0x08C25BAC. These six entries are the verified case blocks
# (cmp #5 at 0x0820CC14); seed them as interior resumes so an indirect case
# branch stays in translated code instead of bridging as a false subroutine.
[[extra_func]]
addr = 0x0820CCDE
mode = "thumb"
resume = true
note = "DrawTopBarText switch case 0; target from verified ROM table 0x08C25BAC"

[[extra_func]]
addr = 0x0820CD14
mode = "thumb"
resume = true
note = "DrawTopBarText switch case 1; target from verified ROM table 0x08C25BAC"

[[extra_func]]
addr = 0x0820CD18
mode = "thumb"
resume = true
note = "DrawTopBarText switch case 2; target from verified ROM table 0x08C25BAC"

[[extra_func]]
addr = 0x0820CD1C
mode = "thumb"
resume = true
note = "DrawTopBarText switch case 3; target from verified ROM table 0x08C25BAC"

[[extra_func]]
addr = 0x0820CC20
mode = "thumb"
resume = true
note = "DrawTopBarText switch case 4; target from verified ROM table 0x08C25BAC"

[[extra_func]]
addr = 0x0820CC9A
mode = "thumb"
resume = true
note = "DrawTopBarText switch case 5; target from verified ROM table 0x08C25BAC"

# Task_NamingScreen is called through an absolute Thumb jump table at
# 0x088DEA94 (cmp #9 at 0x0815D088). Seed all ten interior case entries so
# state transitions in the rival-name screen stay in translated code.
[[extra_func]]
addr = 0x0815D102
mode = "thumb"
resume = true
note = "Task_NamingScreen switch case 0; target from verified ROM table 0x088DEA94"

[[extra_func]]
addr = 0x0815D112
mode = "thumb"
resume = true
note = "Task_NamingScreen switch case 1; target from verified ROM table 0x088DEA94"

