# Hand-maintained shared recompiler/runtime config for the Modern Emerald ROM.
# Generated symbol metadata is passed as a later --config overlay and never
# overwrites this file.

[program]
name = "Pokemon Modern Emerald (USA)"
id = "pokemon_modern_emerald"
load_address = 0x08000000
size = 0x02000000
entry_pc = 0x08000000
static_resume_all = true

[identity]
sha1 = "a3cc21dc076e5e0af690d98d0f009ca7e23e707c"

# The vector at 0x08000000 is the ARM reset entry. IntrMain is an assembly IRQ
# dispatch root with ELF STT_NOTYPE, so it is explicitly seeded here.
[[extra_func]]
addr = 0x08000250
mode = "arm"
name = "IntrMain"
note = "ELF map/objdump verified IRQ dispatch root; ELF type is NOTYPE"

# The ROM's options_plus_menu DrawTopBarText switch uses an absolute Thumb
# jump table at 0x08BD196C. These six entries are the verified case blocks
# (cmp #5 at 0x082079C4); seed them as interior resumes so an indirect case
# branch stays in translated code instead of bridging as a false subroutine.
[[extra_func]]
addr = 0x08207A8E
mode = "thumb"
resume = true
note = "DrawTopBarText switch case 0; target from verified ROM table 0x08BD196C"

[[extra_func]]
addr = 0x08207AC4
mode = "thumb"
resume = true
note = "DrawTopBarText switch case 1; target from verified ROM table 0x08BD196C"

[[extra_func]]
addr = 0x08207AC8
mode = "thumb"
resume = true
note = "DrawTopBarText switch case 2; target from verified ROM table 0x08BD196C"

[[extra_func]]
addr = 0x08207ACC
mode = "thumb"
resume = true
note = "DrawTopBarText switch case 3; target from verified ROM table 0x08BD196C"

[[extra_func]]
addr = 0x082079D0
mode = "thumb"
resume = true
note = "DrawTopBarText switch case 4; target from verified ROM table 0x08BD196C"

[[extra_func]]
addr = 0x08207A4A
mode = "thumb"
resume = true
note = "DrawTopBarText switch case 5; target from verified ROM table 0x08BD196C"

# Task_NamingScreen is called through an absolute Thumb jump table at
# 0x088C00E4 (cmp #9 at 0x081599E4). Seed all ten interior case entries so
# state transitions in the rival-name screen stay in translated code.
[[extra_func]]
addr = 0x08159A5E
mode = "thumb"
resume = true
note = "Task_NamingScreen switch case 0; target from verified ROM table 0x088C00E4"

[[extra_func]]
addr = 0x08159A6E
mode = "thumb"
resume = true
note = "Task_NamingScreen switch case 1; target from verified ROM table 0x088C00E4"

